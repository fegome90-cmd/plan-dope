# RequirementSet Template
# Copy this template to create new requirement sets

RequirementSet:
  id: RQ-2026-0001  # Unique ID: RQ-YYYY-NNNN
  title: "Brief title describing the requirement"
  created: "2026-01-15T10:00:00Z"  # ISO 8601 datetime
  status: "draft"  # draft, active, completed, cancelled

  # Claims: Functional requirements with priority levels
  claims:
    - id: C-001
      text: "Clear, testable requirement statement"
      priority: P0  # P0 (Critical), P1 (Important), P2 (Nice-to-have)
      acceptance_signals:
        - "Measurable outcome 1: How we verify this is done"
        - "Measurable outcome 2: Another verification signal"

    - id: C-002
      text: "Another requirement"
      priority: P1
      acceptance_signals:
        - "How we validate this requirement"

  # Assumptions: What we're assuming is true
  assumptions:
    - id: A-001
      text: "What we're assuming is true"
      confidence: 0.8  # 0.0-1.0 (higher = more confident)
      impact: medium  # low, medium, high
      rationale: "Why this assumption matters (optional)"

  # Constraints: Boundaries and limitations
  constraints:
    - id: CN-001
      type: timeline  # budget, timeline, technology, performance, compliance, security
      description: "Deadline or limitation description"
      hard: false  # true = non-negotiable, false = flexible
